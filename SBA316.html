<!doctype html>
<html>
  <head>
    <title>Form Validation Practice</title>
    <link rel="stylesheet" href="" />
    <!-- Font Awesome for Icons -->
    <script
      src="https://kit.fontawesome.com/d8f052c6cf.js"
      crossorigin="anonymous"
    ></script>
    <script src="./SBA316.js" defer></script>
  </head>

  <body>
    <h1>NBA Team Guess Game</h1>

    <!-- Container / like the staduim -->

    <p id="clue"></p>

    <!-- FORM: game settings -->

    <form id="guess-form">
      <!-- Text input -->
      <input
        id="team-input"
        type="text"
        placeholder="Enter NBA team"
        required
        minlength="3"
      />

      <!-- Submit Button - Submit event listener-->
      <button type="submit">Submit Guess</button>
    </form>
  </body>
</html>
